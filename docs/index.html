<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="icon" type="image/png" href="favicon.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CPS Tester-每秒点击速度测试器</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
      background-color: black;
      color: white;
      overflow: hidden;
      position: relative;
    }

    #click-pad {
      width: 500px;
      height: 300px;
      background: #050AA6;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      border-radius: 10px;
      cursor: pointer;
      user-select: none;
      margin: 20px auto;
      position: relative;
      overflow: hidden;
      transition: transform 0.1s ease, background-color 0.2s ease;
    }

    @keyframes clickEffect {
      0% { transform: scale(1); background-color: #3498db; }
      50% { transform: scale(0.9); background-color: #2980b9; }
      100% { transform: scale(1); background-color: #3498db; }
    }

    #click-pad.clicked {
      animation: clickEffect 0.2s ease;
    }

    .ripple {
      position: absolute;
      width: 20px;
      height: 20px;
      background: rgba(0, 255, 0, 0.4);
      border-radius: 50%;
      transform: scale(0);
      animation: ripple-effect 0.6s ease-out;
      pointer-events: none;
    }

    @keyframes ripple-effect {
      to {
        transform: scale(15);
        opacity: 0;
      }
    }

    img {
      width: 200px;
      margin-top: 20px;
    }

    #lang-btn, #donate-btn {
      margin: 10px;
      padding: 10px 20px;
      cursor: pointer;
      font-size: 16px;
      background-color: white;
      border: 2px solid #3498db;
      border-radius: 5px;
      color: black;
      position: relative;
      z-index: 10;
    }

    .container {
      position: relative;
      z-index: 2;
    }

    .text-background {
      background-color: rgba(255, 255, 255, 0.2);
      padding: 10px;
      border-radius: 5px;
    }

    #status-bar {
      margin-top: 10px;
      font-size: 18px;
    }

    #rain {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    #donate-section {
      display: none;
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      background-color: white;
      padding: 20px;
      border-radius: 10px;
      width: 300px;
      z-index: 20;
    }

    #donate-section h1, #donate-section p {
      color: black;
    }

    #donate-section img {
      width: 100%;
    }

    #close-donate {
      position: absolute;
      top: 10px;
      right: 10px;
      background-color: red;
      color: white;
      border: none;
      padding: 5px 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <button id="lang-btn">中文简体 Switch to English</button>
  <button id="donate-btn">💰 捐赠/Donate with WeChat(China only)</button>

  <div class="container">
    <h1 id="title" class="text-background">点击速度测试（CPS）</h1>
    <label for="time-input" id="label-time" class="text-background">请输入测试时间（秒）：</label>
    <input type="number" id="time-input" value="5" min="1" step="0.1">
    <p id="instructions" class="text-background">点击下面的方块开始！（支持左键和右键）</p>

    <div id="click-pad">
      <div id="pad-text">点击这里！</div>
      <div id="pad-clicks">0</div>
    </div>

    <div id="status-bar" class="text-background">
      <span id="clicks-display">总点击次数：0</span> |
      <span id="cps-display">当前 CPS：0</span> |
      <span id="time-left-display">剩余时间：0s</span>
    </div>

    <hr>
  </div>

  <div id="donate-section">
    <button id="close-donate">X</button>
    <h1 id="donate-title" class="text-background">支持我😄</h1>
    <p id="donate-text" class="text-background">请扫描二维码进行捐赠：</p>
    <p id="thank-you" class="text-background">感谢您的支持！</p>
    <img src="https://cdn.jsdelivr.net/gh/Noah-Li2012/cpstester@main/code.jpg" alt="微信支付二维码">
  </div>

  <canvas id="rain"></canvas>

  <script>
    let clicks = 0;
    let timeLeft = 0;
    let startTime = 0;
    let interval;
    let isRunning = false;
    let lang = "zh";

    function handlePadClick(e) {
      e.preventDefault();
      const pad = document.getElementById("click-pad");
      pad.classList.remove("clicked");
      void pad.offsetWidth;
      pad.classList.add("clicked");

      const ripple = document.createElement("span");
      ripple.className = "ripple";
      const rect = pad.getBoundingClientRect();
      ripple.style.left = `${e.clientX - rect.left}px`;
      ripple.style.top = `${e.clientY - rect.top}px`;
      pad.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);

      if (!isRunning) {
        startTest();
      } else {
        registerClick();
      }
    }

    document.getElementById("click-pad").addEventListener("click", handlePadClick);
    document.getElementById("click-pad").addEventListener("contextmenu", handlePadClick);

    function startTest() {
      clicks = 0;
      document.getElementById("clicks-display").innerText = lang === "zh" ? "总点击次数：0" : "Total Clicks: 0";
      document.getElementById("cps-display").innerText = lang === "zh" ? "当前 CPS：0" : "Current CPS: 0";
      document.getElementById("time-left-display").innerText = lang === "zh" ? "剩余时间：0s" : "Time Left: 0s";
      document.getElementById("pad-clicks").innerText = "0";

      timeLeft = parseFloat(document.getElementById("time-input").value);
      if (timeLeft <= 0 || isNaN(timeLeft)) {
        alert(lang === "zh" ? "请输入有效的时间！" : "Please enter a valid time!");
        return;
      }

      isRunning = true;
      startTime = performance.now();
      interval = setInterval(updateCPS, 10);

      setTimeout(() => {
        clearInterval(interval);
        isRunning = false;
        alert(lang === "zh" ? `时间到！您共点击了 ${clicks} 次。` : `Time's up! You clicked ${clicks} times.`);
      }, timeLeft * 1000);
    }

    function registerClick() {
      if (isRunning) {
        clicks++;
        document.getElementById("clicks-display").innerText = lang === "zh" ? "总点击次数：" + clicks : "Total Clicks: " + clicks;
        document.getElementById("pad-clicks").innerText = "" + clicks;
      }
    }

    function updateCPS() {
      let elapsedTime = (performance.now() - startTime) / 1000;
      let cps = clicks / elapsedTime;
      let remaining = Math.max(0, (timeLeft - elapsedTime)).toFixed(1);
      document.getElementById("cps-display").innerText = lang === "zh" ? "当前 CPS：" + cps.toFixed(2) : "Current CPS: " + cps.toFixed(2);
      document.getElementById("time-left-display").innerText = lang === "zh" ? "剩余时间：" + remaining + "s" : "Time Left: " + remaining + "s";
    }

    document.getElementById("lang-btn").addEventListener("click", function () {
      lang = lang === "zh" ? "en" : "zh";
      document.getElementById("lang-btn").innerText = lang === "zh" ? "中文简体 Switch English" : "English 切换成 中文简体";
      document.getElementById("title").innerText = lang === "zh" ? "点击速度测试（CPS）" : "Click Speed Test (CPS)";
      document.getElementById("label-time").innerText = lang === "zh" ? "请输入测试时间（秒）：" : "Enter test duration (seconds):";
      document.getElementById("instructions").innerText = lang === "zh" ? "点击下面的方块开始！（支持左键和右键）" : "Click the box below to start! (Left & right click supported)";
      document.getElementById("pad-text").innerText = lang === "zh" ? "点击这里！" : "Click Here!";
      document.getElementById("pad-clicks").innerText = "" + clicks;
      document.getElementById("cps-display").innerText = lang === "zh" ? "当前 CPS：0" : "Current CPS: 0";
      document.getElementById("clicks-display").innerText = lang === "zh" ? "总点击次数：0" : "Total Clicks: 0";
      document.getElementById("time-left-display").innerText = lang === "zh" ? "剩余时间：0s" : "Time Left: 0s";
      document.getElementById("donate-title").innerText = lang === "zh" ? "支持我 - 微信支付捐赠" : "Support Me - WeChat Pay Donation";
      document.getElementById("donate-text").innerText = lang === "zh" ? "请扫描二维码进行捐赠：" : "Scan the QR code below to donate:";
      document.getElementById("thank-you").innerText = lang === "zh" ? "感谢您的支持！" : "Thank you for your support!";
    });

    document.getElementById("donate-btn").addEventListener("click", function () {
      document.getElementById("donate-section").style.display = "block";
    });

    document.getElementById("close-donate").addEventListener("click", function () {
      document.getElementById("donate-section").style.display = "none";
    });

    const canvas = document.getElementById('rain');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789".split("");
    const drops = [];

    function createDrop() {
      const x = Math.random() * canvas.width;
      drops.push({ x: x, y: -20, speed: Math.random() * 5 + 2, char: chars[Math.floor(Math.random() * chars.length)] });
    }

    function drawRain() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.1)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "green";
      ctx.font = "20px monospace";

      for (let i = 0; i < drops.length; i++) {
        const drop = drops[i];
        ctx.fillText(drop.char, drop.x, drop.y);
        drop.y += drop.speed;

        if (drop.y > canvas.height) {
          drop.y = -20;
          drop.x = Math.random() * canvas.width;
          drop.char = chars[Math.floor(Math.random() * chars.length)];
        }
      }
    }

    setInterval(createDrop, 100);
    setInterval(drawRain, 30);
  </script>
</body>
</html>
